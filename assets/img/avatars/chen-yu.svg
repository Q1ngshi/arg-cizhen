<feOffset dx="0" dy="0"/>
<feComponentTransfer in="b"><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
<feComposite in="SourceGraphic" operator="over"/>
</filter>
</defs>
<rect width="512" height="512" fill="url(#bg)"/>
