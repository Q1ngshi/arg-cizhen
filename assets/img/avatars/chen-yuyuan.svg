<path d="M268 316 L356 316" stroke-width="4" opacity="0.6"/>
<path d="M284 330 L332 330" stroke-width="3" opacity="0.4"/>
<circle cx="376" cy="158" r="10" opacity="0.5"/>
<path d="M150 130 L250 130" stroke-width="4" opacity="0.35"/>
</g>
<rect x="16" y="16" width="480" height="480" fill="none" stroke="#44301b" stroke-width="3" opacity="0.5"/>
<rect width="512" height="512" filter="url(#vignette)" opacity="0.55"/>
</svg>